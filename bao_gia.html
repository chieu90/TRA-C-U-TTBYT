<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo giá</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230e9f9a%22/%3E%3Cpath d=%22M9 8h14v3H9zM9 14h14v3H9zM9 20h9v3H9z%22 fill=%22white%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f6fa; --surface: #ffffff; --text: #14213d; --muted: #5b6b82; --line: #e2e8f0; --line-2: #eef2f7;
  --brand: #0b5cad; --brand-2: #0e9f9a; --accent: #0b5cad; --accent-soft: #e6f0fb;
  --ok: #15803d; --ok-bg: #e8f7ee; --bad: #c2410c; --bad-bg: #fdeee6; --warn: #b45309; --warn-bg: #fdf3e2;
  --shadow: 0 1px 2px rgba(16,35,70,.06), 0 6px 20px rgba(16,35,70,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1420; --surface: #141d2b; --text: #e5ebf3; --muted: #93a3b8; --line: #243145; --line-2: #1b2636;
    --brand: #3b8bdb; --brand-2: #22b3ad; --accent: #5aa2ec; --accent-soft: #16304d;
    --ok: #4ade80; --ok-bg: #12301f; --bad: #fb923c; --bad-bg: #3a2113; --warn: #fbbf24; --warn-bg: #3a2d12;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
.hero { background: linear-gradient(120deg, var(--brand) 0%, #0a4a8c 45%, var(--brand-2) 100%); color: #fff; padding: 28px 16px 84px; }
.hero-in { max-width: 1200px; margin: 0 auto; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 24px; margin: 0; }
.sub { color: rgba(255,255,255,.85); margin: 10px 0 0; font-size: 14px; }
.sub a, .nav a { color: #fff; }
.nav { display: flex; gap: 8px; }
.nav a { padding: 8px 14px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500;
  background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 1px rgba(255,255,255,.28); white-space: nowrap; }
.nav a:hover { background: rgba(255,255,255,.24); }
.wrap { max-width: 1200px; margin: -60px auto 0; padding: 0 16px 64px; position: relative; }
.panel { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; border: 1px solid var(--line); }
/* thanh tìm kiếm luôn nằm trên cùng khi cuộn trang */
.stickybar { position: sticky; top: 8px; z-index: 30; padding: 12px 14px; margin-bottom: 12px; }
@media (max-width: 760px) { .stickybar { top: 0; border-radius: 0 0 14px 14px; padding: 10px; } .stickybar input { flex-basis: 100%; } }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
input[type=search], input[type=text] { flex: 1 1 280px; min-width: 0; padding: 11px 14px; font-size: 15px; border: 1.5px solid var(--line);
  border-radius: 12px; background: var(--bg); color: var(--text); outline: none; font-family: inherit; }
input:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-soft); }
label.lb { font-size: 13px; color: var(--muted); font-weight: 600; }
button { padding: 10px 16px; font-size: 14px; border-radius: 10px; border: 1px solid var(--line); cursor: pointer; font-weight: 600;
  background: var(--surface); color: var(--text); font-family: inherit; }
button:hover { border-color: var(--accent); color: var(--accent); }
button.pri { color: #fff; border: 0; background: linear-gradient(135deg, var(--brand), var(--brand-2)); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.chips label { cursor: pointer; }
.chips input { display: none; }
.chips span { display: inline-block; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--muted); background: var(--surface); }
.chips span b { font-weight: 600; color: var(--text); margin-left: 4px; }
.chips input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
.chips input:checked + span b { color: #fff; }
.sep { margin: 14px 0 0; padding-top: 14px; border-top: 1px dashed var(--line); }
.opts { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin-top: 12px; }
.opts label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 22px 2px 12px; }
.status { color: var(--muted); font-size: 14px; }
.list { display: grid; gap: 14px; }
.pk { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.pk-h { padding: 14px 18px; border-left: 4px solid var(--brand-2); }
.pk-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
.chip { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap;
  color: var(--accent); background: var(--accent-soft); }
.chip.new { color: var(--ok); background: var(--ok-bg); }
.chip.soon { color: var(--bad); background: var(--bad-bg); }
.chip.mid { color: var(--warn); background: var(--warn-bg); }
.chip.grey { color: var(--muted); background: var(--line-2); }
.code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--muted); }
.pk-name { font-size: 16px; font-weight: 700; margin: 0; }
.pk-meta { color: var(--muted); font-size: 13.5px; margin-top: 4px; display: flex; gap: 6px 18px; flex-wrap: wrap; }
.pk-meta b { color: var(--text); font-weight: 600; }
.pk-meta a { color: var(--accent); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600;
  padding: 8px 10px; background: var(--line-2); border-top: 1px solid var(--line); }
.tbl td { padding: 9px 10px; border-top: 1px solid var(--line-2); vertical-align: top; }
.tbl td.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl .grp { font-size: 12px; color: var(--brand-2); font-weight: 600; }
.tbl .it { font-weight: 600; }
.tbl .sub2 { color: var(--muted); font-size: 12.5px; }
.spec { color: var(--muted); font-size: 12.5px; max-width: 440px; }
.spec.cut { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.hl { background: #fff3b0; color: inherit; border-radius: 3px; }
@media (prefers-color-scheme: dark) { .hl { background: #5a4a00; } }
.empty { padding: 48px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; }
.scroll { overflow-x: auto; }
@media (max-width: 760px) {
  .tbl thead { display: none; }
  .tbl tr { display: block; border-top: 1px solid var(--line); padding: 8px 12px; }
  .tbl td { display: block; border: 0; padding: 2px 0; }
  .tbl td.n { text-align: left; }
  .tbl td[data-l]::before { content: attr(data-l) ": "; color: var(--muted); font-size: 12px; }
  .spec { max-width: none; }
}
.price { font-variant-numeric: tabular-nums; white-space: nowrap; }
.price b { font-weight: 700; }
.qs { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header class="hero"><div class="hero-in">
  <div class="top">
    <h1>Báo giá – sản phẩm quan tâm</h1>
    <nav class="nav"><a href="/goi-thau">Gói thầu</a><a href="/">Tra cứu TBYT</a></nav>
  </div>
  <p class="sub" id="sub">Giá từ Yêu cầu báo giá trên <a href="https://muasamcong.mof.gov.vn/web/guest/smart-price" target="_blank" rel="noopener">muasamcong.mof.gov.vn</a> (mục Hóa chất/vật tư xét nghiệm, thiết bị y tế), cập nhật mỗi sáng. Mỗi mặt hàng có thể nhận nhiều báo giá từ các nhà cung cấp.</p>
</div></header>

<div class="wrap">
  <section class="panel stickybar">
    <div class="row">
      <input type="search" id="q" placeholder="Tìm trong mặt hàng, mô tả… (vd: HIV, Dengue NS1, 5 trong 1)">
      <input type="search" id="noi" list="noiList" placeholder="Nơi yêu cầu / tỉnh / mã YCBG">
      <datalist id="noiList"></datalist>
      <button id="csv">Tải Excel (CSV)</button>
    </div>
  </section>
  <section class="panel">
    <div class="opts" style="margin-top:0">
      <label>Tỉnh/TP <select id="tinh"><option value="">Tất cả</option></select></label>
      <label><input type="checkbox" id="coGia"> Chỉ mặt hàng đã có báo giá</label>
      <label><input type="checkbox" id="onlyNew"> Chỉ báo giá mới (3 ngày gần đây)</label>
      <label>Sắp xếp <select id="sort"><option value="moi">Mới nhất trước</option><option value="sl">Số lượng lớn trước</option><option value="bg">Nhiều báo giá trước</option></select></label>
    </div>
    <div class="chips" id="groups"></div>
  </section>

  <div class="bar"><div class="status" id="status">Đang tải…</div></div>
  <div class="list" id="list"></div>
</div>

<script>
const $ = s => document.querySelector(s);
let DATA = null; const picked = new Set();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
const fmt = n => n == null || n === '' ? '' : Number(n).toLocaleString('vi-VN', { maximumFractionDigits: 0 });

function priceCell(h) {
  if (!h.so_bg) return '<span class="qs">Chưa có báo giá</span>';
  if (h.so_bg === 1) return `<span class="price"><b>${fmt(h.min)}</b></span><div class="qs">1 báo giá</div>`;
  return `<span class="price"><b>${fmt(h.tv)}</b></span><div class="qs">${h.so_bg} báo giá: ${fmt(h.min)} – ${fmt(h.max)}</div>`;
}

function render() {
  if (!DATA) return;
  const q = fold($('#q').value.trim()), noi = fold($('#noi').value.trim()), tinh = $('#tinh').value;
  const coGia = $('#coGia').checked, onlyNew = $('#onlyNew').checked, s = $('#sort').value;
  const now = new Date();
  const items = DATA.items.filter(h => (!picked.size || picked.has(h.nhom)) && (!coGia || h.so_bg)
    && (!tinh || h.tinh === tinh) && (!onlyNew || (now - new Date(h.hieu_luc)) / 86400000 < 3)
    && (!q || fold(h.ten + ' ' + h.mo_ta + ' ' + h.nhom).includes(q))
    && (!noi || fold(h.noi + ' ' + h.tinh + ' ' + h.ma).includes(noi)));
  const by = new Map();
  items.forEach(h => { if (!by.has(h.ma)) by.set(h.ma, { ma: h.ma, noi: h.noi, tinh: h.tinh, hieu_luc: h.hieu_luc, han: h.han, hl_ngay: h.hl_ngay, items: [] }); by.get(h.ma).items.push(h); });
  let rqs = [...by.values()];
  const sum = (r, f) => r.items.reduce((n, h) => n + (typeof f(h) === 'number' ? f(h) : 0), 0);
  rqs.sort((a, b) => s === 'sl' ? sum(b, h => h.sl) - sum(a, h => h.sl) : s === 'bg' ? sum(b, h => h.so_bg) - sum(a, h => h.so_bg)
    : (b.hieu_luc + b.ma).localeCompare(a.hieu_luc + a.ma));
  if (s !== 'moi') rqs.forEach(r => r.items.sort((a, b) => s === 'sl' ? (b.sl || 0) - (a.sl || 0) : b.so_bg - a.so_bg));
  window._view = rqs;
  $('#status').textContent = `${rqs.length} yêu cầu báo giá, ${items.length} mặt hàng` + (DATA.cap_nhat ? ` · cập nhật ${DATA.cap_nhat}` : '');
  $('#list').innerHTML = rqs.length ? rqs.map(r => `<article class="pk"><div class="pk-h">
      <div class="pk-top"><span class="code">${esc(r.ma)}</span><span class="chip">Hiệu lực từ ${esc(r.hieu_luc)}${r.hl_ngay ? ' · ' + esc(r.hl_ngay) + ' ngày' : ''}</span>${(now - new Date(r.hieu_luc)) / 86400000 < 3 ? '<span class="chip new">Mới</span>' : ''}</div>
      <p class="pk-name">${esc(r.noi || '(không ghi nơi yêu cầu)')}</p>
      <div class="pk-meta">${r.tinh ? `<span>Tỉnh/TP: <b>${esc(r.tinh)}</b></span>` : ''}<span>Hạn nhận báo giá: <b>${esc(r.han)}</b></span>
        <a href="https://muasamcong.mof.gov.vn/web/guest/smart-price" target="_blank" rel="noopener" title="Mở trang Giá từ Yêu cầu báo giá, nhập mã ${esc(r.ma)} vào ô Mã YCBG">Tra mã trên muasamcong ↗</a></div>
    </div><div class="scroll"><table class="tbl"><thead><tr><th>Mặt hàng</th><th>ĐVT</th><th style="text-align:right">Số lượng</th><th style="text-align:right">Đơn giá báo (trung vị)</th><th>Mô tả / yêu cầu kỹ thuật</th></tr></thead><tbody>
      ${r.items.map(h => `<tr><td data-l="Mặt hàng"><div class="grp">${esc(h.nhom)}</div><div class="it">${esc(h.ten)}</div></td>
        <td data-l="ĐVT">${esc(h.dvt)}</td><td class="n" data-l="Số lượng">${fmt(h.sl)}</td><td class="n" data-l="Đơn giá">${priceCell(h)}</td>
        <td><div class="spec cut">${esc(h.mo_ta)}</div></td></tr>`).join('')}
    </tbody></table></div></article>`).join('') : '<div class="empty">Không có báo giá phù hợp.</div>';
}

function groups() {
  const cnt = {}; DATA.items.forEach(h => cnt[h.nhom] = (cnt[h.nhom] || 0) + 1);
  $('#groups').innerHTML = DATA.nhom.filter(g => cnt[g]).map(g =>
    `<label><input type="checkbox" value="${esc(g)}"${picked.has(g) ? ' checked' : ''}><span>${esc(g)}<b>${cnt[g]}</b></span></label>`).join('');
}

function csv() {
  const rows = [['Mã YCBG','Nơi yêu cầu','Tỉnh/TP','Hiệu lực từ','Hạn nhận báo giá','Nhóm','Mặt hàng','Mô tả','ĐVT','Số lượng','Số báo giá','Giá thấp nhất','Giá trung vị','Giá cao nhất','Tất cả giá báo']];
  (window._view || []).forEach(r => r.items.forEach(h => rows.push([h.ma, h.noi, h.tinh, h.hieu_luc, h.han, h.nhom, h.ten, h.mo_ta, h.dvt, h.sl, h.so_bg, h.min, h.tv, h.max, (h.gia || []).join('; ')])));
  const text = '\ufeff' + rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  a.download = 'bao-gia-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
}

$('#list').addEventListener('click', e => { const s = e.target.closest('.spec'); if (s) s.classList.toggle('cut'); });
$('#groups').addEventListener('change', e => { e.target.checked ? picked.add(e.target.value) : picked.delete(e.target.value); render(); });
['#q', '#noi'].forEach(s => $(s).addEventListener('input', render));
['#tinh', '#coGia', '#onlyNew', '#sort'].forEach(s => $(s).addEventListener('change', render));
$('#csv').addEventListener('click', csv);

fetch('/api/bao-gia').then(r => r.json()).then(d => {
  if (!d.items) throw new Error(d.error || 'Chưa có dữ liệu');
  DATA = d;
  $('#noiList').innerHTML = [...new Set(d.items.map(h => h.noi).filter(Boolean))].sort().map(c => `<option value="${esc(c)}">`).join('');
  const cntT = {}; d.items.forEach(h => { if (h.tinh) cntT[h.tinh] = (cntT[h.tinh] || 0) + 1; });
  $('#tinh').innerHTML = '<option value="">Tất cả</option>' + Object.keys(cntT).sort((a, b) => a.localeCompare(b, 'vi')).map(t => `<option value="${esc(t)}">${esc(t)} (${cntT[t]})</option>`).join('');
  groups(); render();
}).catch(e => { $('#status').textContent = 'Chưa có dữ liệu báo giá (' + e.message + ').'; });
</script>
</body>
</html>
