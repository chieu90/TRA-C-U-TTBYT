# Tự cập nhật mỗi giờ, không cần máy cá nhân hay Claude. Chỉ dùng API công khai của muasamcong (không qua reCAPTCHA):
# - Gói thầu đã biết: làm mới tên, giá, hạn và trạng thái hủy qua API (goi_thau.py refresh)
# - Báo giá: tab "Giá đã báo" + làm mới các YCBG đã biết (bao_gia.py)
# - Kết quả trúng thầu: KQ Test, KQ Đường Huyết, Cơ sở y tế (co_so_y_te.py; trạng thái hủy lấy từ index/goi_thau_cache/meta_*.json)
# Tìm gói thầu / YCBG MỚI vẫn chạy trên máy (trình duyệt) vì ô tìm kiếm có reCAPTCHA.
name: Cập nhật dữ liệu tự động (mỗi giờ)

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/cap-nhat-bao-gia.yml'
      - 'goi_thau.py'

permissions:
  contents: write

concurrency:
  group: cap-nhat-du-lieu
  cancel-in-progress: false

jobs:
  cap-nhat:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Làm mới gói thầu đã biết từ muasamcong
        id: goi-thau
        run: python3 goi_thau.py refresh
        continue-on-error: true
      - name: Lấy báo giá từ muasamcong
        run: python3 bao_gia.py
        continue-on-error: true
      - name: Lấy kết quả trúng thầu từ muasamcong
        run: python3 co_so_y_te.py
        continue-on-error: true
      - name: Đẩy dữ liệu nếu có thay đổi
        run: |
          FILES="data/goi_thau.json data/bao_gia.json data/co_so_y_te.json data/trung_thau.json data/duong_huyet.json"
          CHANGED=$(python3 - $FILES <<'PY'
          import json, subprocess, sys
          for f in sys.argv[1:]:
              old = subprocess.run(["git", "show", "HEAD:" + f], capture_output=True, text=True).stdout
              try:
                  a, b = json.loads(old or "{}"), json.load(open(f, encoding="utf-8"))
              except Exception:
                  continue
              a.pop("cap_nhat", None); b.pop("cap_nhat", None)
              if a != b:
                  print(f)
          PY
          )
          if [ -z "$CHANGED" ]; then echo "Không có dữ liệu mới."; exit 0; fi
          echo "Có thay đổi: $CHANGED"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $CHANGED
          git commit -m "Tự cập nhật dữ liệu $(TZ=Asia/Ho_Chi_Minh date '+%d/%m/%Y %H:%M') [skip render]"
          # GitHub đôi khi báo lỗi tạm thời khi push (fatal error in commit_refs) -> thử lại
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            sleep 30
          done
          exit 1
      - name: Báo lỗi nếu làm mới gói thầu chưa hoàn tất
        if: steps.goi-thau.outcome == 'failure'
        run: |
          echo "::error::Có gói thầu chưa làm mới được qua API. Dữ liệu cũ của các gói này được giữ lại; xem log bước làm mới."
          exit 1
