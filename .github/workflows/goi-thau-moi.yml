name: Tự tìm gói thầu mới
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - 'goi_thau_moi.py'
permissions:
  contents: write
concurrency:
  group: cap-nhat-du-lieu
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tìm gói mới và lọc mặt hàng
        id: discover
        timeout-minutes: 12
        run: python3 -u goi_thau_moi.py --limit 40
        continue-on-error: true
      - name: Lưu gói mới đã lấy thành công
        if: always()
        run: |
          python3 persist_goi_moi.py prepare /tmp/new-tender-additions.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # This is an ephemeral runner. The additions are saved outside the checkout.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 persist_goi_moi.py merge /tmp/new-tender-additions.json
            git add data/goi_thau.json data/goi_thau_discovery.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Tự thêm gói thầu mới qua nguồn tìm kiếm tham chiếu [skip render]"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Báo lỗi để lần sau thử lại
        if: steps.discover.outcome == 'failure'
        run: |
          echo "::error::Chưa xử lý hết nguồn tìm kiếm; dữ liệu đã lấy thành công được lưu, phần lỗi sẽ thử lại."
          exit 1
