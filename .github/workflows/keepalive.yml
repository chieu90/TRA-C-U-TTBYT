# Mở trang mỗi ~10 phút để gói miễn phí của Render không cho trang "ngủ" (ngủ sau 15 phút không dùng).
name: Giu trang luon chay
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Go cua trang tra cuu
        run: curl -fsS -m 120 --retry 3 --retry-delay 10 -o /dev/null -w "%{http_code} %{time_total}s\n" https://tra-cuu-tbyt.onrender.com/
