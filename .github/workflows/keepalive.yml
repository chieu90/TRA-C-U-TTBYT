# Mo trang moi ~10 phut de goi mien phi cua Render khong cho trang ngu (ngu sau 15 phut khong dung).
name: Giu trang luon chay
on: {schedule: [{cron: "*/10 * * * *"}], workflow_dispatch: {}}
jobs: {ping: {runs-on: ubuntu-latest, timeout-minutes: 5, steps: [{name: Go cua trang tra cuu, run: curl -fsS -m 120 --retry 3 --retry-delay 10 -o /dev/null https://tra-cuu-tbyt.onrender.com/}]}}
