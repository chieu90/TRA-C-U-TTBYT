name: Kiểm tra API tìm gói mới
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Xác định đường dẫn API trong ứng dụng đấu thầu hiện tại
        run: |
          python3 - <<'PY'
          import re, urllib.request
          from urllib.parse import urlsplit, urljoin
          import goi_thau as g
          app = g.HOST + "/egp/ebidfe/"
          with urllib.request.urlopen(app, timeout=30, context=g.SSL_CTX) as r:
              html = r.read().decode(errors="replace")
              print("APP HTTP", r.status)
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)', html)
          for src in scripts:
              path = urlsplit(src).path
              print("SCRIPT PATH", path)
              if not any(k in path for k in ("main", "runtime", "config")): continue
              target = urljoin(app,src)
              if urlsplit(target).netloc != urlsplit(g.HOST).netloc: continue
              with urllib.request.urlopen(target, timeout=30, context=g.SSL_CTX) as r:
                  js = r.read().decode(errors="replace")
              values = set(re.findall(r"""["'\x60]([a-zA-Z0-9_./:-]{3,240})["'\x60]""", js))
              for value in sorted(values):
                  if any(k in value.lower() for k in ("search", "captcha", "recaptcha")) and ("/" in value or "captcha" in value.lower()):
                      print("PUBLIC SEARCH PATH", urlsplit(value).path)
          PY
