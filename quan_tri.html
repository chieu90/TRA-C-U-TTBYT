<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản trị tài khoản – Muasamcong ADC</title>
<meta name="theme-color" content="#0b5cad">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #f3f6fa; --surface: #fff; --text: #14213d; --muted: #5b6b82; --line: #e2e8f0; --line-2: #eef2f7;
  --brand: #0b5cad; --brand-2: #0e9f9a; --accent-soft: #e6f0fb; --ok: #15803d; --ok-bg: #e8f7ee; --bad: #c2410c; --bad-bg: #fdeee6;
  --warn: #b45309; --warn-bg: #fdf3e2; --shadow: 0 1px 2px rgba(16,35,70,.06), 0 6px 20px rgba(16,35,70,.06); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1420; --surface: #141d2b; --text: #e5ebf3; --muted: #93a3b8; --line: #243145; --line-2: #1b2636;
  --brand: #3b8bdb; --brand-2: #22b3ad; --accent-soft: #16304d; --ok: #4ade80; --ok-bg: #12301f; --bad: #fb923c; --bad-bg: #3a2113;
  --warn: #fbbf24; --warn-bg: #3a2d12; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: "Be Vietnam Pro", system-ui, sans-serif; }
.hero { background: linear-gradient(120deg, var(--brand) 0%, #0a4a8c 45%, var(--brand-2) 100%); color: #fff; padding: 24px 16px 72px; }
.hero-in { max-width: 1100px; margin: 0 auto; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.hero h1 { margin: 0; font-size: 22px; }
.nav { display: flex; gap: 8px; flex-wrap: wrap; }
.nav a { color: #fff; padding: 8px 14px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; background: rgba(255,255,255,.14); }
.wrap { max-width: 1100px; margin: -52px auto 32px; padding: 0 16px; }
.card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px; }
.card h2 { margin: 0 0 4px; font-size: 17px; }
.cap { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.role { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
.role b { display: block; font-size: 14px; margin-bottom: 4px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); }
td { padding: 10px 8px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
td .sub { color: var(--muted); font-size: 12.5px; }
select, input { font: inherit; font-size: 13.5px; padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
button { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; }
button.pri { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; border: 0; }
button.del { color: var(--bad); }
.tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.tag.cho_duyet { background: var(--warn-bg); color: var(--warn); }
.tag.hoat_dong { background: var(--ok-bg); color: var(--ok); }
.tag.khoa { background: var(--bad-bg); color: var(--bad); }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.msg { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--surface);
  padding: 10px 16px; border-radius: 10px; font-size: 14px; display: none; z-index: 60; }
@media (max-width: 760px) {
  thead { display: none; } tr { display: block; border-bottom: 1px solid var(--line); padding: 8px 0; }
  td { display: flex; justify-content: space-between; gap: 10px; border: 0; padding: 5px 0; }
  td::before { content: attr(data-l); color: var(--muted); font-size: 12.5px; }
}
</style>
</head>
<body>
<header class="hero"><div class="hero-in"><div class="top">
  <h1>Quản trị tài khoản</h1>
  <nav class="nav"><a href="/goi-thau">Gói thầu</a><a href="/bao-gia">Báo giá</a><a href="/co-so-y-te">Cơ sở y tế</a><a href="/trung-thau">KQ Test</a><a href="/duong-huyet">KQ Đường Huyết</a></nav>
</div></div></header>
<main class="wrap">
  <section class="card"><h2>Vai trò</h2><p class="cap">Mỗi tài khoản thuộc một vai trò. Đổi vai trò có hiệu lực ngay ở lần tải trang kế tiếp của người đó.</p><div class="roles" id="roles"></div></section>
  <section class="card"><h2>Tài khoản</h2><p class="cap" id="cap"></p><div class="scroll"><table>
    <thead><tr><th>Người dùng</th><th>Trạng thái</th><th>Vai trò</th><th>Đăng ký / đăng nhập cuối</th><th>Thao tác</th></tr></thead>
    <tbody id="rows"><tr><td colspan="5">Đang tải…</td></tr></tbody></table></div></section>
</main>
<div class="msg" id="msg"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TAB_NAME = { 'goi-thau': 'Gói thầu', 'bao-gia': 'Báo giá', 'co-so-y-te': 'Cơ sở y tế', 'trung-thau': 'KQ Test', 'duong-huyet': 'KQ Đường huyết', 'so-sanh': 'So sánh' };
const ST_NAME = { cho_duyet: 'Chờ duyệt', hoat_dong: 'Hoạt động', khoa: 'Đã khóa' };
const when = s => s ? new Date(s).toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' }) : '–';
let ROLES = {}, ME = null;
function toast(t) { const m = $('#msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => m.style.display = 'none', 3000); }
async function post(action, data) {
  const r = await fetch('/api/auth?action=' + action, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.loi || 'Lỗi'); return d;
}
async function load() {
  const [me, r] = await Promise.all([fetch('/api/auth?action=toi').then(x => x.json()), fetch('/api/auth?action=ds')]);
  ME = me.tai_khoan; const d = await r.json();
  if (!r.ok) { $('#rows').innerHTML = `<tr><td colspan="5">${esc(d.loi)}</td></tr>`; return; }
  ROLES = d.vai_tro;
  $('#roles').innerHTML = Object.entries(ROLES).map(([k, v]) => `<div class="role"><b>${esc(v.ten)}</b>${v.tabs.map(t => TAB_NAME[t]).join(', ')}${k === 'admin' ? ', quản trị tài khoản' : ''}</div>`).join('');
  const cho = d.ds.filter(u => u.trang_thai === 'cho_duyet').length;
  $('#cap').textContent = `${d.ds.length} tài khoản` + (cho ? `, ${cho} đang chờ duyệt` : '');
  const roleSel = u => `<select data-k="vai_tro">${Object.entries(ROLES).map(([k, v]) => `<option value="${k}"${k === u.vai_tro ? ' selected' : ''}>${esc(v.ten)}</option>`).join('')}</select>`;
  $('#rows').innerHTML = d.ds.map(u => `<tr data-id="${u.id}">
    <td data-l="Người dùng"><div><b>${esc(u.ten)}</b>${u.id === ME.id ? ' (bạn)' : ''}<div class="sub">${esc(u.email)}${u.sdt ? ' · ' + esc(u.sdt) : ''}</div></div></td>
    <td data-l="Trạng thái"><span class="tag ${u.trang_thai}">${ST_NAME[u.trang_thai] || u.trang_thai}</span></td>
    <td data-l="Vai trò">${roleSel(u)}</td>
    <td data-l="Đăng ký / đăng nhập"><div class="sub">${when(u.tao_luc)}<br>${when(u.dang_nhap_cuoi)}</div></td>
    <td data-l="Thao tác"><div class="acts">
      ${u.trang_thai === 'cho_duyet' ? '<button class="pri" data-a="duyet">Duyệt</button>' : ''}
      ${u.trang_thai !== 'cho_duyet' ? '<button data-a="luu">Lưu vai trò</button>' : ''}
      ${u.trang_thai === 'hoat_dong' && u.id !== ME.id ? '<button data-a="khoa">Khóa</button>' : ''}
      ${u.trang_thai === 'khoa' ? '<button data-a="mo">Mở khóa</button>' : ''}
      <button data-a="mk">Đặt mật khẩu</button>
      ${u.id !== ME.id ? `<button class="del" data-a="xoa">${u.trang_thai === 'cho_duyet' ? 'Từ chối' : 'Xóa'}</button>` : ''}
    </div></td></tr>`).join('') || '<tr><td colspan="5">Chưa có tài khoản.</td></tr>';
}
$('#rows').addEventListener('click', async e => {
  const a = e.target.dataset.a; if (!a) return;
  const tr = e.target.closest('tr'), id = +tr.dataset.id, vai_tro = tr.querySelector('[data-k=vai_tro]').value;
  const name = tr.querySelector('b').textContent;
  try {
    if (a === 'duyet') { await post('sua', { id, vai_tro, trang_thai: 'hoat_dong' }); toast(`Đã duyệt ${name} (${ROLES[vai_tro].ten})`); }
    if (a === 'luu') { await post('sua', { id, vai_tro }); toast('Đã lưu vai trò'); }
    if (a === 'khoa') { if (!confirm(`Khóa tài khoản ${name}?`)) return; await post('sua', { id, trang_thai: 'khoa' }); toast('Đã khóa'); }
    if (a === 'mo') { await post('sua', { id, trang_thai: 'hoat_dong' }); toast('Đã mở khóa'); }
    if (a === 'xoa') { if (!confirm(`Xóa tài khoản ${name}? Không hoàn tác được.`)) return; await post('xoa', { id }); toast('Đã xóa'); }
    if (a === 'mk') { const p = prompt(`Mật khẩu mới cho ${name} (tối thiểu 8 ký tự):`); if (!p) return; await post('dat-mat-khau', { id, mat_khau: p }); toast('Đã đặt mật khẩu mới'); }
    load();
  } catch (err) { toast(err.message); }
});
load();
</script>
<script src="/tai-khoan.js" defer></script>
</body>
</html>
